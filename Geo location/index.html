<!DOCTYPE html>
<html>
<head>
<title>Show My Location</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:Arial;
    background:#1a1a1a;
    overflow:hidden;
    color:white;
}

/* ===== Animated Decorative Background ===== */
.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20px 20px,#6aa0a055 15px,transparent 17px),
        radial-gradient(circle at 80px 20px,#b08ab055 15px,transparent 17px),
        radial-gradient(circle at 50px 52px,#88888855 15px,transparent 17px);
    background-size:100px 86px;
    animation:bgMove 20s linear infinite;
}

@keyframes bgMove{
    from{ background-position:0 0; }
    to{ background-position:200px 170px; }
}

/* ===== Center Content Using Positioning ===== */
.box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

/* ===== Button Styling + Hover Animation ===== */
button{
    padding:14px 32px;
    font-size:16px;
    border:none;
    border-radius:25px;
    background:#ff7f50;
    color:white;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 8px 15px rgba(0,0,0,0.4);
}

button:hover{
    background:#ff4500;
    transform:scale(1.1);
}

/* ===== Coordinate Card ===== */
#loc{
    margin-top:20px;
    padding:15px;
    background:white;
    color:black;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,0.4);
    opacity:0;
    transform:scale(0.8);
}

/* ===== Animation on Update ===== */
#loc.show{
    animation:pop 0.5s ease forwards;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="box">
    <button onclick="getLoc()">Show My Location</button>
    <p id="loc"></p>
</div>

<script>
function getLoc(){
    navigator.geolocation.getCurrentPosition(pos=>{
        loc.innerHTML =
        "Latitude: " + pos.coords.latitude.toFixed(4) + "<br>" +
        "Longitude: " + pos.coords.longitude.toFixed(4);
        loc.classList.add("show");
    });
}
</script>

</body>
</html>
