<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Nav</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:Arial, sans-serif;}

    header{
      background:#111827;
      color:#fff;
    }
    .nav{
      max-width:900px;
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
    }
    .logo{font-weight:bold;font-size:1.1rem;}

    .nav-links{
      list-style:none;
      display:flex;
      gap:20px;
    }
    .nav-links a{
      position:relative;
      text-decoration:none;
      color:#e5e7eb;
      padding-bottom:4px;
      font-size:0.95rem;
    }
    .nav-links a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:0;
      height:2px;
      background:#3b82f6;
      transition:width 0.25s ease;
    }
    .nav-links a:hover::after{
      width:100%;
    }

    @media (max-width:600px){
      .nav{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
      }
      .nav-links{
        width:100%;
        flex-direction:column;
        gap:8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <div class="logo">my website</div>
      <ul class="nav-links">
        <li><a href="#home">home</a></li>
        <li><a href="#projects">projects</a></li>
        <li><a href="#about">about</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
