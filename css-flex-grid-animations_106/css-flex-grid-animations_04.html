<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Section</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:#e5e7eb;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .hero{
      max-width:1100px;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
    }

    .hero-text{
      flex:1;
      animation:slideIn 0.9s ease-out;
    }
    .hero-title{
      font-size:2.4rem;
      margin-bottom:12px;
      color:#f9fafb;
    }
    .hero-subtitle{
      font-size:1rem;
      color:#9ca3af;
      margin-bottom:22px;
      max-width:450px;
    }

    .hero-btn{
      display:inline-block;
      padding:12px 26px;
      border-radius:999px;
      border:none;
      background:#3b82f6;
      color:#fff;
      font-size:1rem;
      cursor:pointer;
      text-decoration:none;
      animation:pulse 1.6s ease-in-out infinite;
      box-shadow:0 12px 25px rgba(59,130,246,0.4);
    }

    .hero-image{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .hero-image img{
      max-width:100%;
      width:380px;
      border-radius:24px;
      box-shadow:0 20px 40px rgba(0,0,0,0.45);
    }

    @keyframes slideIn{
      from{opacity:0;transform:translateX(-40px);}
      to{opacity:1;transform:translateX(0);}
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.06);}
      100%{transform:scale(1);}
    }

    @media (max-width:768px){
      .hero{
        flex-direction:column;
        text-align:center;
      }
      .hero-subtitle{
        margin-left:auto;
        margin-right:auto;
      }
      .hero-image{
        order:-1; 
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-text">
      <h1 class="hero-title">Level Up Your Projects</h1>
      <p class="hero-subtitle">
        batmobile
      </p>
      <a href="#get-started" class="hero-btn">Get Started</a>
    </div>

    <div class="hero-image">
      <img src="https://static0.polygonimages.com/wordpress/wp-content/uploads/chorus/uploads/chorus_asset/file/19767385/ESSHpVWWAAALoTr.jpg?w=1600&h=900&fit=crop" alt="Hero illustration">
    </div>
  </section>
</body>
</html>
