<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:Arial, sans-serif;
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .pricing{
      display:flex;
      gap:24px;
      max-width:1100px;
      width:100%;
      justify-content:center;
      padding:40px 20px;
    }

    .card{
      flex:1 1 260px;
      background:#fff;
      border-radius:20px;
      padding:40px 20px 32px;
      text-align:center;
      box-shadow:0 18px 35px rgba(0,0,0,0.08);
      transition:transform 0.25s ease, box-shadow 0.25s ease;
    }

    .name{
      font-size:1.6rem;
      font-weight:bold;
      margin-bottom:10px;
    }
    .price{
      font-size:2.4rem;
      font-weight:bold;
      margin-bottom:16px;
    }
    .features{
      list-style:none;
      font-size:1rem;
      line-height:1.8;
      margin-bottom:26px;
    }
    .btn{
      padding:10px 30px;
      border-radius:999px;
      border:none;
      background:#111;
      color:#fff;
      font-size:1rem;
      cursor:pointer;
    }

    /* Animated gradient middle card */
    .card.pro{
      position:relative;
      color:#fff;
      background:linear-gradient(135deg,#ff5f6d,#ff9966,#ff5fd1);
      background-size:250% 250%;
      transform:scale(1.05);
      animation:gradFlow 8s ease-in-out infinite;
      box-shadow:0 24px 45px rgba(0,0,0,0.18);
    }
    .card.pro .btn{
      background:#fff;
      color:#ff3b6b;
    }

    .card.pro:hover{
      transform:scale(1.08) translateY(-6px);
      box-shadow:0 30px 60px rgba(0,0,0,0.3);
    }

    @keyframes gradFlow{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    @media(max-width:768px){
      .pricing{
        flex-direction:column;
        align-items:center;
      }
      .card{
        max-width:340px;
      }
    }
  </style>
</head>
<body>
  <section class="pricing">
    <article class="card">
      <div class="name">Basic</div>
      <div class="price">$19/mo</div>
      <ul class="features">
        <li>10 Projects</li>
        <li>5 GB Storage</li>
        <li>Email Support</li>
      </ul>
      <button class="btn">Select</button>
    </article>

    <article class="card pro">
      <div class="name">Pro</div>
      <div class="price">$49/mo</div>
      <ul class="features">
        <li>50 Projects</li>
        <li>25 GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <button class="btn">Select</button>
    </article>

    <article class="card">
      <div class="name">Premium</div>
      <div class="price">$99/mo</div>
      <ul class="features">
        <li>Unlimited Projects</li>
        <li>100 GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <button class="btn">Select</button>
    </article>
  </section>
</body>
</html>
