<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asymmetrical Gallery</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:Arial, sans-serif;
      background:#020a1a;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      grid-auto-rows:170px;
      gap:14px;
      max-width:950px;
      width:100%;
    }

    .item{
      position:relative;
      overflow:hidden;
    }
    .item img{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:grayscale(100%);
      transition:filter 0.3s ease, transform 0.3s ease;
    }
    .item:hover img{
      filter:grayscale(0%);
      transform:scale(1.05);
    }

    /* specific layout to mimic your screenshot */
    .i1{grid-column:1 / span 2; grid-row:1 / span 2;} /* big car left */
    .i2{grid-column:3 / span 1; grid-row:1 / span 1;}
    .i3{grid-column:4 / span 1; grid-row:1 / span 3;} /* tall right */
    .i4{grid-column:1 / span 2; grid-row:3 / span 1;} /* long bottom-left */
    .i5{grid-column:3 / span 1; grid-row:2 / span 1;}
    .i6{grid-column:1 / span 2; grid-row:4 / span 1;}
    .i7{grid-column:3 / span 1; grid-row:3 / span 1;}
    .i8{grid-column:4 / span 1; grid-row:4 / span 2;} /* tall bottom-right */

    @media(max-width:768px){
      .gallery{
        grid-template-columns:repeat(2, 1fr);
        grid-auto-rows:150px;
      }
      /* remove explicit lines on mobile so it just flows */
      .i1,.i2,.i3,.i4,.i5,.i6,.i7,.i8{
        grid-column:auto;
        grid-row:auto;
      }
    }
  </style>
</head>
<body>
  <section class="gallery">
    <figure class="item i1">
      <img src="https://f1rst-motors.s3.me-central-1.amazonaws.com/blog/1714730316035-blob" alt="Photo 1">
    </figure>
    <figure class="item i2">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQvo6ABfnpAMtxKjNVBHHtBRcmMDtjCKU4LzQ&s" alt="Photo 2">
    </figure>
    <figure class="item i3">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTI5rRPJ3mXThDnIbUT99zYydbjJEolD7dIOg&s" alt="Photo 3">
    </figure>
    <figure class="item i4">
      <img src="https://www.spinny.com/blog/wp-content/uploads/2023/01/New-Project-2-1160x653.webp" alt="Photo 4">
    </figure>
    <figure class="item i5">
      <img src="https://www.usnews.com/cmsmedia/81/4c/ddc428a541f5bf712092529fea63/p90541178-highres-rolls-royce-arcadia-1.jpg" alt="Photo 5">
    </figure>
    <figure class="item i6">
      <img src="https://www.spinny.com/blog/wp-content/uploads/2025/07/Most-Expensive-Car-in-the-World-Bugatti-Centodieci-1160x730.webp" alt="Photo 6">
    </figure>
    <figure class="item i7">
      <img src="https://www.intotheblue.co.uk/blog/wp-content/uploads/2023/05/Supercars-2.0-Sian.png" alt="Photo 7">
    </figure>
    <figure class="item i8">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlPK_MoPTG57Wp_s_WnFgl6bjL378Xb8M6HQ&s" alt="Photo 8">
    </figure>
  </section>
</body>
</html>
