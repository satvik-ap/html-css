<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:Arial, sans-serif;
      background:#313e50;
      color:#111827;
      min-height:100vh;
      display:grid;
      grid-template-columns:220px 1fr;
      grid-template-rows:60px 1fr;
      grid-template-areas:
        "sidebar header"
        "sidebar main";
    }

    /* Sidebar */
    .sidebar{
      grid-area:sidebar;
      background:#111827;
      color:#e5e7eb;
      padding:20px 18px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }
    .sidebar-title{font-size:1.3rem;font-weight:bold;}
    .nav{
      display:flex;
      flex-direction:column;
      gap:10px;
      font-size:0.95rem;
    }

    /* Header */
    .header{
      grid-area:header;
      background:#ffffff;
      border-bottom:1px solid #e5e7eb;
      padding:0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:0.95rem;
    }

    /* Main */
    .main{
      grid-area:main;
      padding:24px;
      overflow:auto;
    }

    .card{
      background:#ffffff;
      border-radius:10px;
      box-shadow:0 8px 20px rgba(15,23,42,0.05);
      padding:16px 18px 20px;
      margin-bottom:16px;
    }

    .line{
      height:10px;
      border-radius:999px;
      margin-bottom:10px;
      background:linear-gradient(90deg,#e5e7eb 20%,#d4d4d4 40%,#e5e7eb 60%);
      background-size:200% 100%;
      animation:shimmer 1.4s ease-in-out infinite;
    }
    .line.long{width:100%;}
    .line.med{width:70%;}
    .line.short{width:45%;}

    @keyframes shimmer{
      0%{background-position:-120% 0;}
      100%{background-position:120% 0;}
    }

    @media(max-width:900px){
      body{
        grid-template-columns:1fr;
        grid-template-rows:auto auto 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }
      .sidebar{
        flex-direction:row;
        align-items:center;
        gap:16px;
      }
      .nav{
        flex-direction:row;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-title">Dashboard</div>
    <nav class="nav">
      <span>Home</span>
      <span>Analytics</span>
      <span>Reports</span>
      <span>Settings</span>
    </nav>
  </aside>

  <header class="header">
    <span>Welcome Back</span>
    <span>User</span>
  </header>

  <main class="main">
    <section class="card">
      <div class="line long"></div>
      <div class="line long"></div>
      <div class="line med"></div>
    </section>

    <section class="card">
      <div class="line long"></div>
      <div class="line long"></div>
      <div class="line long"></div>
      <div class="line short"></div>
    </section>
  </main>
</body>
</html>
