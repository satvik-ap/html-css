<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stats Section</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:Arial, sans-serif;
      background:#f3f4f6;
      color:#0f172a;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px 16px;
    }

    .stats{
      max-width:900px;
      width:100%;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:16px;
    }

    .card{
      border-radius:12px;
      padding:14px 16px;
      text-align:left;
      box-shadow:0 8px 20px rgba(15,23,42,0.12);
      cursor:pointer;
      transform:translateY(0);
      transition:transform 0.2s ease;
      color:#0f172a;
      background:#ffffff;
    }
    .card.blue{background:#dbeafe;}
    .card.green{background:#dcfce7;}
    .card.purple{background:#ede9fe;}
    .card.orange{background:#ffedd5;}

    .label{
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:#4b5563;
      margin-bottom:6px;
    }
    .value{
      font-size:1.6rem;
      font-weight:bold;
      margin-bottom:4px;
    }
    .hint{
      font-size:0.8rem;
      color:#6b7280;
    }

    .card:hover{
      animation:bounce 0.5s ease;
    }
    @keyframes bounce{
      0%,100%{transform:translateY(0);}
      40%{transform:translateY(-6px);}
      70%{transform:translateY(2px);}
    }

    @media(max-width:900px){
      .stats{grid-template-columns:repeat(2, 1fr);}
    }
    @media(max-width:500px){
      .stats{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <section class="stats">
    <article class="card blue">
      <div class="label">Users</div>
      <div class="value">1.2K</div>
      <div class="hint">+120 this week</div>
    </article>

    <article class="card green">
      <div class="label">Sessions</div>
      <div class="value">3.8K</div>
      <div class="hint">Avg. 4.3 per user</div>
    </article>

    <article class="card purple">
      <div class="label">Conversion</div>
      <div class="value">4.9%</div>
      <div class="hint">+0.8% vs last month</div>
    </article>

    <article class="card orange">
      <div class="label">Revenue</div>
      <div class="value">$9.3K</div>
      <div class="hint">This quarter</div>
    </article>
  </section>
</body>
</html>
