<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medium Flip Card</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,Arial,sans-serif;
      background:#0f172a;
      color:#e5e7eb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .flip-card{
      width:260px;
      height:180px;
      perspective:900px;
    }

    .flip-card-inner{
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transition:transform .6s ease;
    }

    .flip-card:hover .flip-card-inner{
      transform:rotateY(180deg);
    }

    .flip-face{
      position:absolute;
      inset:0;
      backface-visibility:hidden;
      border-radius:.9rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:1.1rem;
      text-align:center;
    }

    .flip-front{
      background:#1e293b;
      border:1px solid #334155;
    }

    .flip-back{
      background:#22c55e;
      color:#052e16;
      border:1px solid #16a34a;
      transform:rotateY(180deg);
    }

    .flip-face h2{
      font-size:1.1rem;
      margin-bottom:.4rem;
    }

    .flip-face p{
      font-size:.85rem;
      opacity:.9;
    }
  </style>
</head>
<body>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-face flip-front">
        <h2>Front side</h2>
        <p>Hover over this card to see the back.</p>
      </div>
      <div class="flip-face flip-back">
        <h2>Back side</h2>
        <p>helo.</p>
      </div>
    </div>
  </div>
</body>
</html>
