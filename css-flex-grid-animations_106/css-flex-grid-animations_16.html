<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Responsive Footer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,Arial,sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:#f3f4f6;
    }

    footer{
      background:#0f172a;
      color:#e5e7eb;
      padding:2rem 1.5rem 1.5rem;
    }

    .footer-inner{
      max-width:1100px;
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:1.5rem;
    }

    .footer-col{
      display:flex;
      flex-direction:column;
      gap:.4rem;
      font-size:.9rem;
    }

    .footer-title{
      font-weight:600;
      margin-bottom:.4rem;
      font-size:.95rem;
    }

    .footer-links{
      display:flex;
      flex-direction:column;
      gap:.2rem;
    }

    .footer-links a{
      text-decoration:none;
      color:#9ca3af;
      font-size:.87rem;
      transition:color .2s ease, transform .2s ease;
    }

    .footer-links a:hover{
      color:#e5e7eb;
      transform:translateX(3px);
    }

    .footer-bottom{
      max-width:1100px;
      margin:1.5rem auto 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:.8rem;
      color:#9ca3af;
      border-top:1px solid #1f2937;
      padding-top:.8rem;
    }

    .footer-social{
      display:flex;
      gap:.75rem;
    }

    .footer-social a{
      color:#9ca3af;
      text-decoration:none;
      transition:color .2s ease;
    }

    .footer-social a:hover{
      color:#e5e7eb;
    }

    @media (max-width:800px){
      .footer-inner{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width:550px){
      .footer-inner{
        grid-template-columns:1fr;
      }
      .footer-bottom{
        flex-direction:column;
        align-items:flex-start;
        gap:.4rem;
      }
    }
  </style>
</head>
<body>
  <main></main>

  <footer>
    <div class="footer-inner">
      <div class="footer-col">
        <div class="footer-title">Brand</div>
        <p style="font-size:.85rem;color:#9ca3af;">
          helo.
        </p>
      </div>

      <div class="footer-col">
        <div class="footer-title">Product</div>
        <div class="footer-links">
          <a href="#">Overview</a>
          <a href="#">Features</a>
          <a href="#">Pricing</a>
          <a href="#">Releases</a>
        </div>
      </div>

      <div class="footer-col">
        <div class="footer-title">Company</div>
        <div class="footer-links">
          <a href="#">About</a>
          <a href="#">Blog</a>
          <a href="#">Careers</a>
          <a href="#">Contact</a>
        </div>
      </div>

      <div class="footer-col">
        <div class="footer-title">Support</div>
        <div class="footer-links">
          <a href="#">Help center</a>
          <a href="#">Documentation</a>
          <a href="#">Status</a>
          <a href="#">Privacy</a>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <span>© 2026 me. All rights reserved.</span>
      <div class="footer-social">
        <a href="#">Twitter</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </footer>
</body>
</html>
