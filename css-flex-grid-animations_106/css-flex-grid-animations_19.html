<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Progress Bars</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,Arial,sans-serif;
      background:#0f172a;
      color:#e5e7eb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem 1.2rem;
    }

    .progress-section{
      width:100%;
      max-width:700px;
      background:#020617;
      border-radius:1rem;
      padding:1.8rem 1.6rem 1.6rem;
      box-shadow:0 18px 40px rgba(0,0,0,.6);
      display:flex;
      flex-direction:column;
      gap:1.2rem;
    }

    .progress-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:.5rem;
      font-size:.9rem;
    }

    .progress-list{
      display:flex;
      flex-direction:column;
      gap:.9rem;
      margin-top:.4rem;
    }

    .progress-item{
      display:flex;
      align-items:center;
      gap:.75rem;
      flex-wrap:wrap;
    }

    .label-wrap{
      flex:1 1 140px;
      display:flex;
      justify-content:space-between;
      font-size:.85rem;
    }

    .label-name{
      color:#e5e7eb;
    }

    .label-value{
      color:#9ca3af;
    }

    .bar-wrap{
      flex:3 1 220px;
      background:#111827;
      border-radius:999px;
      overflow:hidden;
      height:8px;
    }

    .bar-fill{
      height:100%;
      background:linear-gradient(90deg,#22c55e,#3b82f6);
      width:0;
      border-radius:999px;
      animation:fillBar 1.5s ease forwards;
    }

    .bar-60{animation-delay:.1s}
    .bar-35{animation-delay:.25s}
    .bar-80{animation-delay:.4s}

    @keyframes fillBar{
      from{width:0}
      to{width:var(--target, 50%)}
    }

    @media(max-width:600px){
      .progress-section{
        padding:1.5rem 1.25rem;
      }
      .label-wrap{
        flex-basis:100%;
      }
      .bar-wrap{
        flex-basis:100%;
      }
    }
  </style>
</head>
<body>
  <section class="progress-section">
    <div class="progress-header">
      <h2 style="font-size:1.1rem;">Progress Overview</h2>
      <span style="color:#9ca3af;font-size:.85rem;">Animated  bars</span>
    </div>

    <div class="progress-list">
      <div class="progress-item">
        <div class="label-wrap">
          <span class="label-name">HTML &amp; CSS</span>
          <span class="label-value">60%</span>
        </div>
        <div class="bar-wrap">
          <div class="bar-fill bar-60" style="--target:60%;"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="label-wrap">
          <span class="label-name">JavaScript</span>
          <span class="label-value">35%</span>
        </div>
        <div class="bar-wrap">
          <div class="bar-fill bar-35" style="--target:35%;"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="label-wrap">
          <span class="label-name">UI Design</span>
          <span class="label-value">80%</span>
        </div>
        <div class="bar-wrap">
          <div class="bar-fill bar-80" style="--target:80%;"></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
